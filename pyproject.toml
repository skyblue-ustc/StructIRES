[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ires-design"
version = "0.1.0"
description = "Baseline-first, structure- and energy-constrained IRES sequence design"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "skyblue-ustc" }]
keywords = ["RNA", "IRES", "sequence-design", "bioinformatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
analysis = [
  "biopython>=1.81",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "seaborn>=0.13",
]
lm = [
  "accelerate>=0.26",
  "datasets>=2.16",
  "huggingface-hub>=0.20",
  "torch>=2.1",
  "transformers>=4.38",
]
search = ["pymoo>=0.6"]
train = ["tensorboard>=2.15", "trl>=0.8", "wandb>=0.16"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ires-design = "ires_design.cli:main"

[project.urls]
Homepage = "https://github.com/skyblue-ustc/ires-design"
Repository = "https://github.com/skyblue-ustc/ires-design"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]


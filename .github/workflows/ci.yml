name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[analysis]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests
      - name: Validate experiment contracts
        run: |
          ires-design validate-experiment configs/experiments/smoke.json
          ires-design validate-experiment configs/experiments/de_novo_main.json
          ires-design validate-experiment configs/experiments/mutation_main.json
